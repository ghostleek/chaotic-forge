<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="tuxedo-3d-title tuxedo-3d-desc">
  <title id="tuxedo-3d-title">Tuxedo the dapper cat — dimensional vector illustration</title>
  <desc id="tuxedo-3d-desc">A charcoal cat with a cream face blaze, muzzle and bib, sculpted as a rounded clay figurine in three-quarter view. Original reusable SVG illustration authored by Codex with shaded vector paths, a transparent background and a soft contact shadow; not a rendered 3D model.</desc>
