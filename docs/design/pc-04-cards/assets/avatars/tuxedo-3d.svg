    <radialGradient id="tuxedo-3d-clay" cx="30%" cy="20%" r="86%">
      <stop stop-color="#858495"/><stop offset=".53" stop-color="#4A4A5B"/><stop offset="1" stop-color="#292A38"/>
    </radialGradient>
    <linearGradient id="tuxedo-3d-side" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4A4A5B"/><stop offset="1" stop-color="#292A38"/>
    </linearGradient>
    <radialGradient id="tuxedo-3d-cream" cx="32%" cy="18%" r="94%">
      <stop stop-color="#FFF3DB"/><stop offset=".65" stop-color="#FFF3DB"/><stop offset="1" stop-color="#CFBCA0"/>
    </radialGradient>
    <radialGradient id="tuxedo-3d-shadow"><stop stop-color="#262033" stop-opacity=".28"/><stop offset="1" stop-color="#262033" stop-opacity="0"/></radialGradient>
  </defs>
