<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="lilac-3d-title lilac-3d-desc">
  <title id="lilac-3d-title">Lilac the playful cat — dimensional vector illustration</title>
  <desc id="lilac-3d-desc">A lavender cat with a folded ear, one winking eye and a tiny pink tongue, sculpted as a rounded clay figurine in three-quarter view. Original reusable SVG illustration authored by Codex with shaded vector paths, a transparent background and a soft contact shadow; not a rendered 3D model.</desc>
