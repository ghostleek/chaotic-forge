    </radialGradient>
    <linearGradient id="lilac-3d-side" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#BBA0DC"/><stop offset="1" stop-color="#79619F"/>
    </linearGradient>
    <radialGradient id="lilac-3d-cream" cx="32%" cy="18%" r="94%">
      <stop stop-color="#EDE1FB"/><stop offset=".65" stop-color="#EDE1FB"/><stop offset="1" stop-color="#B6A0D0"/>
    </radialGradient>
    <radialGradient id="lilac-3d-shadow"><stop stop-color="#262033" stop-opacity=".28"/><stop offset="1" stop-color="#262033" stop-opacity="0"/></radialGradient>
  </defs>
