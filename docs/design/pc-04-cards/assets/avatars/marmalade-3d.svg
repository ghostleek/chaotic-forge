<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="marmalade-3d-title marmalade-3d-desc">
  <title id="marmalade-3d-title">Marmalade the tabby cat — dimensional vector illustration</title>
  <desc id="marmalade-3d-desc">An orange tabby with toasted stripes and a cream bib, sculpted as a rounded clay figurine in three-quarter view. Original reusable SVG illustration authored by Codex with shaded vector paths, a transparent background and a soft contact shadow; not a rendered 3D model.</desc>
  <defs>
    <radialGradient id="marmalade-3d-clay" cx="30%" cy="20%" r="86%">
      <stop stop-color="#FFE0AA"/><stop offset=".53" stop-color="#EFA765"/><stop offset="1" stop-color="#B96035"/>
    </radialGradient>
    <linearGradient id="marmalade-3d-side" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EFA765"/><stop offset="1" stop-color="#B96035"/>
    </linearGradient>
    <radialGradient id="marmalade-3d-cream" cx="32%" cy="18%" r="94%">
      <stop stop-color="#FFF4DC"/><stop offset=".65" stop-color="#FFF4DC"/><stop offset="1" stop-color="#DFC7A0"/>
    </radialGradient>
    <radialGradient id="marmalade-3d-shadow"><stop stop-color="#262033" stop-opacity=".28"/><stop offset="1" stop-color="#262033" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="66" cy="117" rx="49" ry="9" fill="url(#marmalade-3d-shadow)"/>
